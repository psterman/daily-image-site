const selected = new Set(['hot', 'ai', 'portrait']);
let groupFilter = '全部';
let kindFilter = 'all';
let dateFilter = 'all';

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function allDates() {
  const set = new Set();
  PACKS.forEach((p) => p.boards.forEach((b) => set.add(b.date)));
  return ['all', ...[...set].sort().reverse()];
}

function kindChip(kind) {
  return '<span class="kind ' + esc(kind) + '">' + esc(KIND_LABEL[kind] || kind) + '</span>';
}

function filteredBoards(pack) {
  return pack.boards.filter((b) => {
    if (kindFilter !== 'all' && b.kind !== kindFilter) return false;
    if (dateFilter !== 'all' && b.date !== dateFilter) return false;
    return true;
  });
}

function sourceStrip(pack) {
  const map = new Map();
  pack.boards.forEach((b) => {
    const k = b.kind + '|' + b.sourceName;
    if (!map.has(k)) map.set(k, b);
  });
  return [...map.values()];
}

function renderFilters() {
  const gBox = document.getElementById('groupFilters');
  gBox.querySelectorAll('.chip').forEach((n) => n.remove());
  GROUPS.forEach((g) => {
    const n = g === '全部' ? PACKS.length : PACKS.filter((p) => p.group === g).length;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (groupFilter === g ? ' active' : '');
    b.innerHTML = esc(g) + '<span class="n">' + n + '</span>';
    b.addEventListener('click', () => { groupFilter = g; draw(); });
    gBox.appendChild(b);
  });

  const kBox = document.getElementById('kindFilters');
  kBox.querySelectorAll('.chip').forEach((n) => n.remove());
  KINDS.forEach((k) => {
    let n = 0;
    if (k.key === 'all') {
      n = PACKS.reduce((a, p) => a + p.boards.length, 0);
    } else {
      PACKS.forEach((p) => { n += p.boards.filter((b) => b.kind === k.key).length; });
    }
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (kindFilter === k.key ? ' active' : '');
    b.innerHTML = esc(k.label) + '<span class="n">' + n + '</span>';
    b.addEventListener('click', () => { kindFilter = k.key; draw(); });
    kBox.appendChild(b);
  });

  const dBox = document.getElementById('dateFilters');
  dBox.querySelectorAll('.chip').forEach((n) => n.remove());
  allDates().forEach((d) => {
    const label = d === 'all' ? '全部日期' : d;
    let n = 0;
    if (d === 'all') n = PACKS.reduce((a, p) => a + p.boards.length, 0);
    else PACKS.forEach((p) => { n += p.boards.filter((b) => b.date === d).length; });
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (dateFilter === d ? ' active' : '');
    b.innerHTML = esc(label) + '<span class="n">' + n + '</span>';
    b.addEventListener('click', () => { dateFilter = d; draw(); });
    dBox.appendChild(b);
  });
}

function mediaHtml(item, pack) {
  if (item.img) return '<img class="thumb" src="' + esc(item.img) + '" alt="" loading="lazy">';
  return '<span class="thumb ico mark ' + esc(pack.mark) + '">' + esc(pack.name.slice(0, 1)) + '</span>';
}

function renderBoard(b, pack) {
  const el = document.createElement('div');
  el.className = 'board';
  el.innerHTML =
    '<div class="board-h">' +
    kindChip(b.kind) +
    '<div class="board-title">' + esc(b.series) + '</div>' +
    '<div class="board-date">' + esc(b.date) + '</div>' +
    '</div>';
  const meta = document.createElement('div');
  meta.className = 'board-meta';
  meta.style.padding = '0 10px 6px';
  meta.style.background = '#fff';
  meta.textContent = '来源 ' + b.sourceName + ' · ' + b.items.length + ' 条';
  el.appendChild(meta);

  b.items.forEach((item) => {
    const row = document.createElement('button');
    row.type = 'button';
    row.className = 'row';
    row.innerHTML =
      '<span class="rank' + (item.rank <= 3 ? ' top' : '') + '">' + item.rank + '</span>' +
      mediaHtml(item, pack) +
      '<span class="body">' +
      '<span class="title">' + esc(item.title) + '</span>' +
      (item.sum ? '<span class="sum">' + esc(item.sum) + '</span>' : '') +
      '<span class="src-line">' + kindChip(b.kind) +
      '<span class="src-name">' + esc(b.sourceName) + '</span>' +
      '<span>' + esc(b.series) + '</span></span>' +
      '</span>';
    el.appendChild(row);
  });
  return el;
}

function renderCard(p) {
  const on = selected.has(p.key);
  const boards = filteredBoards(p);
  const card = document.createElement('div');
  card.className = 'card' + (on ? ' selected' : '');
  if (groupFilter !== '全部' && p.group !== groupFilter) card.hidden = true;
  if (!boards.length) card.hidden = true;

  const pick = document.createElement('button');
  pick.type = 'button';
  pick.className = 'badge' + (on ? '' : ' soft');
  pick.textContent = on ? '✓ 已订阅' : '+ 订阅';
  pick.addEventListener('click', (e) => {
    e.stopPropagation();
    if (on) selected.delete(p.key); else selected.add(p.key);
    draw();
  });

  const sources = sourceStrip(p);
  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML =
    '<div class="mark ' + esc(p.mark) + '">' + esc(p.name.slice(0, 1)) + '</div>' +
    '<div><div class="name">' + esc(p.name) + '</div>' +
    '<div class="sub">' + esc(p.group) + ' · ' + sources.length + ' 个具名来源 · ' +
    p.boards.length + ' 个按日系列</div>' +
    '<div class="pack-desc">' + esc(p.desc) + '</div></div>';
  head.addEventListener('click', () => {
    if (on) selected.delete(p.key); else selected.add(p.key);
    draw();
  });

  const strip = document.createElement('div');
  strip.className = 'source-strip';
  sources.forEach((s) => {
    const pill = document.createElement('span');
    pill.className = 'source-pill';
    pill.innerHTML = kindChip(s.kind) + '<span>' + esc(s.sourceName) + '</span>';
    strip.appendChild(pill);
  });

  const list = document.createElement('div');
  list.className = 'list';
  if (!boards.length) {
    list.innerHTML = '<div class="empty" style="padding:8px;color:var(--muted)">当前筛选下无系列</div>';
  } else {
    boards.forEach((b) => list.appendChild(renderBoard(b, p)));
  }

  const foot = document.createElement('div');
  foot.className = 'foot';
  foot.textContent = '系列标题格式：来源名 + 榜/栏目 + 日期';

  card.appendChild(pick);
  card.appendChild(head);
  card.appendChild(strip);
  card.appendChild(list);
  card.appendChild(foot);
  return card;
}

function drawLegend() {
  const box = document.getElementById('legend');
  box.innerHTML = '<span>来源类型：</span>' + KINDS.filter((k) => k.key !== 'all').map((k) =>
    '<span>' + kindChip(k.key) + esc(k.label) + '</span>'
  ).join('');
}

function draw() {
  renderFilters();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  PACKS.forEach((p) => grid.appendChild(renderCard(p)));
  document.getElementById('chosen').textContent = String(selected.size);
}

document.getElementById('goRead').addEventListener('click', () => {
  alert('示意：已订阅 ' + selected.size + ' 个内容包。正式站按系列日期生成今日阅读。');
});

drawLegend();
draw();
</script>
