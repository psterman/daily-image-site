<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>ingest selftest</title></head>
<body>
<pre>ingest-map selftest — 看 title</pre>
<script type="module">
import {
  MAX_SUMMARY, CATEGORY_TO_TAGS, mapCategory, matchKeywords, stripHtml,
  normalizeUrl, toContentItem, mapFeedItems,
} from '../lib/ingest-map.mjs';
import { contentHash } from '../lib/platform-model.mjs';

const R = [];
const ok = (n, c, x = '') => R.push((c ? 'OK' : 'FAIL') + ':' + n + (x ? '(' + x + ')' : ''));
const SRC = '11111111-1111-4111-8111-111111111111';
const TAGID = { ai: 'a1', opensource: 'o1', tech: 't1', finance: 'f1', design: 'd1', movie: 'm1', portrait: 'p1' };
const resolveTagId = (k) => TAGID[k] || null;

try {
  // 1. 分类 → 标签包映射
  ok('cat_ai', JSON.stringify(mapCategory('ai')) === '["ai"]');
  ok('cat_tools', mapCategory('tools').join(',') === 'opensource,tech');
  ok('cat_biz', mapCategory('finance').length === 0); // biz→finance，传错 key 应为空
  ok('cat_biz_ok', mapCategory('biz').join(',') === 'finance');
  ok('cat_hot_blocked', mapCategory('hot').length === 0); // 时政热榜不进平台
  ok('cat_current_blocked', mapCategory('current').length === 0);
  ok('cat_ent_blocked', mapCategory('ent').length === 0); // 视觉包不靠见报分类
  ok('cat_fun_blocked', mapCategory('fun').length === 0);
  ok('cat_unknown', mapCategory('nonsense').length === 0);
  ok('cat_dedup', mapCategory('tools').filter((x, i, a) => a.indexOf(x) === i).length === 2);

  // 2. 关键词兜底（电影/轻松/人像关掉，防文字稿冒充图片包）
  ok('kw_opensource', matchKeywords('在 GitHub 上开源了一个新框架').includes('opensource'));
  ok('kw_ai', matchKeywords('新大模型发布，Agent 能力翻倍').includes('ai'));
  ok('kw_no_movie', !matchKeywords('本周片单与影评推荐').includes('movie'));
  ok('kw_no_funny', !matchKeywords('今日搞笑段子合集').includes('funny'));
  ok('kw_no_portrait', !matchKeywords('街头人像摄影作品合集').includes('portrait'));
  ok('kw_empty', matchKeywords('今天天气不错').length === 0);

  // 3. HTML 清洗
  ok('strip_html', stripHtml('<b>标题</b> &amp; 内容') === '标题 & 内容');
  ok('strip_script', stripHtml('<p>A</p><p>B</p>') === 'A B');

  // 4. URL 归一化（剥追踪参数，保留身份参数）
  ok('norm_url', normalizeUrl('HTTPS://Example.com/a/?utm=1#x') === 'example.com/a');
  ok('norm_trail', normalizeUrl('https://a.com/b/') === 'a.com/b');
  ok('norm_keep_id', normalizeUrl('http://www.dapenti.com/blog/more.asp?name=a&id=1')
    !== normalizeUrl('http://www.dapenti.com/blog/more.asp?name=a&id=2'));
  ok('norm_drop_utm_keep_id', normalizeUrl('https://a.com/x?utm_source=rss&id=9') === 'a.com/x?id=9');

  // 5. 单条映射 + 版权纪律
  const row = toContentItem({
    title: '<i>深度</i>解析大模型 Agent', link: 'https://news.example.com/agent',
    desc: '这是一段很长的摘要'.repeat(60), ts: 1700000000000,
    categories: ['ai'], source: '量子位',
  }, { sourceId: SRC, publisher: '量子位' });
  ok('map_title', row.title === '深度解析大模型 Agent');
  ok('map_url', row.canonical_url === 'https://news.example.com/agent');
  ok('map_rights_unknown', row.rights_status === 'unknown', row.rights_status);
  ok('map_no_image', row.image_url === null);
  ok('map_summary_cap', row.summary.length <= MAX_SUMMARY, 'len=' + row.summary.length);
  ok('map_tag_ai', row.metadata.tag_keys.includes('ai'));
  ok('map_hash_url_based', row.content_hash === contentHash(row.canonical_url, row.title));
  ok('map_publisher', row.metadata.publisher === '量子位');

  // 6. allowSnippet=false → 不存摘要
  const noSnip = toContentItem({ title: '禁止摘要', link: 'https://x.com/1', desc: '秘密内容', categories: ['tech'] },
    { sourceId: SRC, allowSnippet: false });
  ok('no_snippet', noSnip.summary === null);
  ok('still_has_title', noSnip.title === '禁止摘要');

  // 7. 无效输入被拒
  ok('reject_no_title', toContentItem({ title: '', link: 'https://x.com/2' }, { sourceId: SRC }) === null);
  ok('reject_bad_url', toContentItem({ title: '有标题', link: 'javascript:alert(1)' }, { sourceId: SRC }) === null);
  ok('reject_no_source', toContentItem({ title: '有标题', link: 'https://x.com/3' }, {}) === null);

  // 8. 批量：去重 + 标签链接 + 无标签过滤
  const items = [
    { title: '开源项目发布', link: 'https://github.com/a/b', desc: '开源工具', categories: ['dev'], source: '掘金' },
    { title: '开源项目发布改标题', link: 'https://github.com/a/b?utm=2', desc: '同链接', categories: ['dev'] },
    { title: 'AI 新模型', link: 'https://ai.com/m', desc: 'llm', categories: ['ai'] },
    { title: '一条热榜', link: 'https://hot.com/1', desc: '热议', categories: ['hot'] }, // 无标签 → 过滤
    { title: '', link: 'https://x.com/empty' },
  ];
  const batched = mapFeedItems(items, { sourceId: SRC, resolveTagId });
  ok('batch_rows', batched.rows.length === 2, 'rows=' + batched.rows.length);
  ok('batch_dedupe', batched.reasons.duplicate === 1, 'dup=' + batched.reasons.duplicate);
  ok('batch_notag', batched.reasons.noTag === 1, 'noTag=' + batched.reasons.noTag);
  ok('batch_notitle', batched.reasons.noTitle === 1);
  ok('batch_tagkeys', batched.tagKeys.includes('opensource') && batched.tagKeys.includes('ai'), batched.tagKeys.join(','));
  ok('batch_links', batched.links.length === batched.rows.length, 'links=' + batched.links.length);
  ok('batch_link_shape', batched.links.every((l) => l.content_item_id && l.tag_pack_id && l.confidence === 100));

  // 9. 确定性：同输入两次映射的 hash 一致（幂等 upsert 基础）
  const h1 = mapFeedItems(items, { sourceId: SRC }).rows.map((r) => r.content_hash).join(',');
  const h2 = mapFeedItems(items, { sourceId: SRC }).rows.map((r) => r.content_hash).join(',');
  ok('deterministic_hash', h1 === h2 && h1.length > 0);

  const fails = R.filter((x) => x.startsWith('FAIL')).length;
  document.title = 'INGEST|' + (R.length - fails) + '/' + R.length + '|' + R.join('|');
} catch (e) {
  document.title = 'INGEST|ERROR|' + (e && e.stack ? e.stack : e);
}
</script>
</body>
</html>
