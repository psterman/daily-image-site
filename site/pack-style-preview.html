<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>选内容包 · B 定稿预览</title>
<style>
:root{
  --bg:#f3f4f6; --surface:#fff; --surface-2:#fafafa; --border:#e6e8ec;
  --text:#171717; --muted:#8a8a8a; --muted-2:#b3b3b3;
  --primary:#07c160; --primary-soft:#e8f8ef;
  --shadow:0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
img{display:block;background:#eceef2}
.wrap{max-width:1220px;margin:0 auto;padding:22px 16px 52px}
h1{font-size:22px;font-weight:540;margin:0 0 6px;letter-spacing:-.3px}
.desc{color:var(--muted);margin:0 0 14px;max-width:820px}
.note{
  font-size:12px;color:var(--muted);margin:0 0 14px;padding:10px 12px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;line-height:1.55;
}
.note b{color:var(--text);font-weight:540}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0}
.legend i{
  font-style:normal;font-size:11px;padding:2px 8px;border-radius:999px;
  border:1px solid var(--border);background:#fff;color:var(--muted);
}
.legend i.t1{border-color:#b7d3f5;background:#eef5ff;color:#1d4f91}
.legend i.t2{border-color:#b7ebcf;background:var(--primary-soft);color:#0a7a3d}
.legend i.t3{border-color:#e2e2e2;background:#f4f4f5;color:#666}
.page-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.btn{border:1px solid var(--border);background:var(--surface);padding:7px 12px;border-radius:8px;box-shadow:var(--shadow);color:inherit}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{background:#fff;border-color:#f0c2c2;color:#b42318}

.fmt-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.fmt-label{font-size:12px;color:var(--muted)}
.fmt-chip{
  border:1px solid var(--border);background:#fff;border-radius:999px;padding:4px 10px;font-size:11px;color:var(--muted);
}
.fmt-chip.on{background:var(--primary-soft);border-color:#b7ebcf;color:var(--primary)}

.sel-hero{
  margin:0 0 14px;padding:16px 16px 14px;border:1px solid var(--border);border-radius:14px;
  background:linear-gradient(135deg,#f7fbf8 0%,#fff 48%,#f4f7fb 100%);
  box-shadow:var(--shadow);
}
.sel-hero .hero-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sel-hero h2{margin:0;font-size:18px;font-weight:560;letter-spacing:-.3px}
.sel-hero .hero-sub{font-size:12px;color:var(--muted)}
.sel-hero.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:13px}
.sel-grid{display:flex;flex-wrap:wrap;gap:8px}
.sel-chip{
  display:inline-flex;align-items:center;gap:8px;padding:8px 10px 8px 8px;
  border:1px solid var(--border);border-radius:12px;background:#fff;max-width:100%;
}
.sel-chip .mark{width:28px;height:28px;border-radius:8px;font-size:11px}
.sel-chip .who{min-width:0}
.sel-chip .who b{display:block;font-size:13px;font-weight:560;line-height:1.2}
.sel-chip .who .dir{
  display:inline-block;margin-top:3px;font-size:10px;padding:1px 6px;border-radius:999px;
  border:1px solid #d7e8dc;background:var(--primary-soft);color:#0a7a3d;
}
.sel-chip .icos{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-left:2px}
.sel-chip .icos img,.sel-chip .icos .letter{
  width:16px;height:16px;border-radius:4px;border:1px solid var(--border);background:#fff;font-size:9px;
}
.sel-chip .icos .more{font-size:10px;color:var(--muted-2)}
.sel-chip .x{
  border:0;background:transparent;color:var(--muted-2);padding:0 2px;font-size:14px;line-height:1;
}
.sel-chip .x:hover{color:#b42318}

.picker{
  display:grid;grid-template-columns:168px 1fr;min-height:0;
  border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden;
}
@media(max-width:900px){
  .picker{grid-template-columns:1fr}
  .picker.mobile-detail .title-rail{display:none}
  .picker:not(.mobile-detail) .main-pane{display:none}
}

.title-rail{
  border-right:1px solid var(--border);background:#f7f8fa;
  padding:16px 8px 16px 12px;display:flex;flex-direction:column;gap:2px;
}
.title-rail .rail-label{font-size:11px;color:var(--muted-2);padding:0 10px 10px;letter-spacing:.04em}
.title-btn{
  width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;
  border-radius:10px;color:var(--muted);display:flex;flex-direction:column;gap:2px;
}
.title-btn:hover{background:rgba(0,0,0,.03);color:var(--text)}
.title-btn.on{background:#fff;color:var(--text);box-shadow:var(--shadow)}
.title-btn .big{font-size:21px;font-weight:560;letter-spacing:-.4px;line-height:1.15}
.title-btn .small{font-size:11px;color:var(--muted)}
.title-btn.on .small{color:var(--primary)}

.main-pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fcfcfd}
.main-scroll{overflow:auto;flex:1;padding:14px 14px 18px;max-height:min(78vh,820px)}
.main-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.main-top h2{margin:0;font-size:22px;font-weight:560;letter-spacing:-.45px}
.main-top .sub{margin:3px 0 0;font-size:12px;color:var(--muted)}
.search{
  width:100%;max-width:200px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:#fff;font-size:13px;
}

.group{margin-bottom:14px}
.subhead{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding-bottom:6px;margin-bottom:10px;border-bottom:1px solid var(--border);
}
.subhead h3{margin:0;font-size:13px;font-weight:560}
.subhead span{font-size:11px;color:var(--muted)}

.pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pack-grid.solo{grid-template-columns:1fr}
.pack-grid.solo .pack-card{flex-direction:row;align-items:stretch}
.pack-grid.solo .pack-cover{width:168px;height:88px;flex:none;grid-template-rows:43px 43px}
.pack-grid.solo .pack-card .body{padding:10px 12px;gap:6px}
.pack-grid.solo .pack-expand{margin-top:0}
.pack-card{
  border:1px solid var(--border);border-radius:12px;background:#fff;padding:0;
  text-align:left;color:inherit;overflow:hidden;box-shadow:var(--shadow);
  display:flex;flex-direction:column;
}
.pack-card:hover{border-color:#c9ced6}
.pack-card.on{border-color:#b7ebcf}
.pack-card.open{border-color:var(--primary);box-shadow:0 0 0 2px rgba(7,193,96,.12)}
.pack-cover{
  display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:56px 56px;gap:2px;
  background:#e8eaef;height:114px;
}
.pack-cover > :first-child{grid-row:1 / span 2}
.pack-cover .tile,.item .tile,.src-hero .tile{
  width:100%;height:100%;position:relative;overflow:hidden;background:var(--tone,#dbe4f0);
}
.pack-cover .tile img.photo,.src-hero .tile img.photo,.item .tile img.photo{
  width:100%;height:100%;object-fit:cover;
}
.pack-cover .tile.fallback,.src-hero .tile.fallback,.item .tile.fallback{
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.pack-cover .tile.fallback img.ico{width:36px;height:36px;border-radius:8px;background:#fff;border:1px solid rgba(255,255,255,.5)}
.src-hero .tile.fallback img.ico{width:40px;height:40px;border-radius:10px;background:#fff}
.item .tile.fallback img.ico{width:28px;height:28px;border-radius:6px;background:#fff;border:1px solid rgba(0,0,0,.06)}
.letter{
  width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  background:#fff;border:1px solid rgba(0,0,0,.06);font-size:12px;font-weight:560;color:#445;
}
.pack-cover .letter{width:36px;height:36px;font-size:14px}
.src-hero .letter{width:40px;height:40px;font-size:15px}
.tier{
  position:absolute;left:6px;bottom:6px;z-index:1;
  font-size:10px;padding:1px 6px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;line-height:1.4;
}
.pack-card .body{padding:12px 12px 11px;display:flex;flex-direction:column;gap:8px;flex:1}
.pack-card .row{display:flex;gap:10px;align-items:flex-start}
.mark{
  width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:540;font-size:12px;flex:none;background:#dbeafe;color:#1e3a8a;
}
.mark.g{background:#dcfce7;color:#166534}
.mark.o{background:#ffedd5;color:#9a3412}
.mark.p{background:#f3e8ff;color:#6b21a8}
.mark.y{background:#fef9c3;color:#854d0e}
.pack-card .name{font-size:15px;font-weight:560;line-height:1.25}
.pack-card .desc{font-size:12px;color:var(--muted);line-height:1.45;margin-top:2px}
.pack-card .src-strip{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pack-card .src-strip img,.pack-card .src-strip .letter{
  width:18px;height:18px;border-radius:4px;border:1px solid var(--border);background:#fff;font-size:10px;
}
.pack-card .src-strip .more{font-size:11px;color:var(--muted-2)}
.item .meta .ico,.item .meta .letter{width:12px;height:12px;border-radius:2px;font-size:9px}
.pack-card .meta{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{
  font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--muted);
}
.pill.ok{background:var(--primary-soft);border-color:#b7ebcf;color:var(--primary)}

.pack-expand{
  margin-top:8px;grid-column:1 / -1;
  border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden;
}
.expand-head{
  padding:10px 12px;border-bottom:1px solid var(--border);
  display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:#fbfbfc;
}
.expand-head .who{display:flex;gap:8px;align-items:center;min-width:0}
.expand-head h4{margin:0;font-size:14px;font-weight:560}
.expand-head p{margin:2px 0 0;font-size:11px;color:var(--muted)}
.expand-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.expand-body{
  padding:10px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(248px,1fr));
  gap:8px;align-content:start;
}

.src-panel{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;min-width:0}
.src-panel.off{opacity:.55}
.src-panel-head{
  display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;
  border:0;background:#f7f8fa;text-align:left;color:inherit;
}
.src-panel-head:hover{background:#f1f3f6}
.src-panel-head .check{
  width:16px;height:16px;border-radius:4px;border:1px solid #d0d4da;
  display:inline-flex;align-items:center;justify-content:center;flex:none;background:#fff;font-size:10px;color:transparent;
}
.src-panel-head .check.on{background:var(--primary);border-color:var(--primary);color:#fff}
.src-panel-head .favicon{width:16px;height:16px;border-radius:4px;flex:none;border:1px solid var(--border);background:#fff}
.src-panel-head .lab{flex:1;min-width:0}
.src-panel-head .lab b{font-weight:560;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-panel-head .lab span{display:block;font-size:10px;color:var(--muted);margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-panel-head .cnt{font-size:10px;color:var(--muted-2);flex:none}

.src-hero{display:none}

.item-list{display:flex;flex-direction:column}
.item{
  display:grid;grid-template-columns:22px 1fr;gap:6px;min-height:0;
  padding:6px 9px;border-top:1px solid var(--border);background:#fff;align-items:start;
}
.item:hover{background:#fafbfc}
.item .tile{display:none}
.item .rk{
  font-size:11px;font-weight:560;color:var(--muted-2);line-height:1.35;padding-top:1px;text-align:right;
}
.item:nth-child(-n+3) .rk{color:#c2410c}
.item .txt{padding:0;min-width:0;display:flex;flex-direction:column;justify-content:center}
.item .ti{font-size:12px;font-weight:520;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .su{display:none}
.item .meta{margin-top:2px;font-size:10px;color:var(--muted-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .meta .ico,.item .meta .letter{display:none}
.item .meta img{display:none}
.item .meta .tag{
  padding:0 5px;border-radius:999px;border:1px solid var(--border);background:#fff;
}
.item .meta .heat{
  padding:0 5px;border-radius:999px;border:1px solid #ffd6a8;background:#fff7ed;color:#c2410c;font-weight:540;
}
.item .meta .rank{
  padding:0 5px;border-radius:999px;border:1px solid var(--border);background:#fff;color:var(--muted);
}
.live-pill{border-color:#b7ebcf;background:var(--primary-soft);color:var(--primary)}
.stale-pill{border-color:#f0c2c2;background:#fff5f5;color:#b42318}

.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
.cta{
  position:sticky;bottom:0;padding:12px 16px;border-top:1px solid var(--border);
  background:rgba(255,255,255,.97);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;
}
.cta .hint{font-size:12px;color:var(--muted)}
.cta .hint b{color:var(--text);font-weight:540}
.cta .actions{display:flex;gap:8px;flex-wrap:wrap}
.back-row{display:none;margin-bottom:8px}
@media(max-width:900px){.back-row{display:block}}
@media(max-width:560px){
  .expand-body{grid-template-columns:1fr}
  .pack-grid.solo .pack-card{flex-direction:column}
  .pack-grid.solo .pack-cover{width:100%;height:100px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="page-head">
    <div>
      <h1>选内容包 · B 定稿预览</h1>
      <p class="desc">热议在「社区」；GitHub / V2EX 在「科技」。顶部 Hero 展示已选栏目与来源图标。</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn" id="btnRefreshHot" title="需重新跑 node tools/refresh-pack-preview-hot.mjs">刷新热榜说明</button>
      <button type="button" class="btn" id="btnSources">完整源列表</button>
      <button type="button" class="btn primary" id="btnDigest">去今日阅读 →</button>
    </div>
  </div>

  <section class="sel-hero" id="selHero" aria-label="已选内容包"></section>

  <div class="note">
    浏览 <b id="dirHint">社区</b>
    · 热榜快照 <b id="hotStamp">未加载</b>
    <div class="legend">
      <i class="t1">① 来源主题图</i>
      <i class="t2">② 条目配图</i>
      <i class="t3">③ favicon 色块</i>
      <i class="t2">社区热议=实况标题</i>
    </div>
  </div>

  <div class="fmt-row">
    <span class="fmt-label">内容格式</span>
    <button type="button" class="fmt-chip on">不限</button>
    <button type="button" class="fmt-chip">RSS</button>
    <button type="button" class="fmt-chip">热榜</button>
    <button type="button" class="fmt-chip">公众号</button>
  </div>

  <div class="picker" id="picker">
    <aside class="title-rail" id="titleRail" aria-label="大标题"></aside>
    <section class="main-pane">
      <div class="main-scroll" id="mainScroll"></div>
      <div class="cta" id="cta"></div>
    </section>
  </div>
</div>

<script src="./pack-hot-snapshot.js"></script>
<script>
const DIRS = [
  { key:'社区', blurb:'社交热榜与开源社区' },
  { key:'科技', blurb:'AI、数码与开发者热帖' },
  { key:'娱乐', blurb:'轻松内容与趣味图' },
  { key:'财经', blurb:'商业与市场速览' },
  { key:'视觉', blurb:'设计与影像' },
  { key:'文化', blurb:'影视与音乐' },
];
const SUBS = {
  '社区': ['社交热榜', '开源与开发'],
  '科技': ['人工智能', '数码新品'],
  '娱乐': ['轻松一刻'],
  '财经': ['商业速览'],
  '视觉': ['设计', '人像'],
  '文化': ['影音'],

/**
 * 来源主题图库（示意用固定 Unsplash id，按品类贴合来源气质）

 */
const THEME_POOL = {

  funny: [

  code: [

  finance: [

  ],
  design: [

    'https://images.unsplash.com/photo-1586717791821-3f44a563fa4c?auto=format&fit=crop&w=900&h=600&q=70',
    'https://images.unsplash.com/photo-1558655146-d09347e92766?auto=format&fit=crop&w=900&h=600&q=70',
  ],
  portrait: [
    'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=900&h=600&q=70',
    'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?auto=format&fit=crop&w=900&h=600&q=70',
    'https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=900&h=600&q=70',

const TIER_LABEL = { source:'来源主题', item:'条目配图', favicon:'图标占位' };

/** 国内站 Google favicon 常空白；DuckDuckGo 更稳，失败再字母块 */
function fav(domain){
  const d = domain || 'example.com';
  return 'https://icons.duckduckgo.com/ip3/' + encodeURIComponent(d) + '.ico';
}
function markLetter(name){
  const ch = String(name || '?').replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g, '').slice(0, 1) || '?';
  return ch.toUpperCase();
}
function themeKey(source){
  return (source && source.theme) || DOMAIN_THEME[source && source.domain] || 'gadget';
}
function themeUrl(source, variant){
  const key = themeKey(source);
  const pool = THEME_POOL[key] || THEME_POOL.gadget;
  const i = Math.abs(Number(variant) || 0) % pool.length;
  return { url: pool[i], tone: THEME_TONE[key] || '#e8eaef', key };
}

/**
 * 配图决议
 * - packCover / sourceHero：来源主题图 → favicon 色块
 * - itemThumb：条目图 → 来源主题图 → favicon 色块
 * 包/源级优先来源自配主题；条目层有图再用条目图。
 */
function resolveFor(role, source, item, variant){
  const domain = (source && source.domain) || 'example.com';
  const theme = themeUrl(source, variant == null ? hash(source && source.n) : variant);
  if (role === 'packCover' || role === 'sourceHero') {
    if (theme.url) return { tier:'source', url:theme.url, tone:theme.tone, domain, label:TIER_LABEL.source };
    return { tier:'favicon', url:'', tone:theme.tone, domain, label:TIER_LABEL.favicon };
  }
  if (item && item.image) return { tier:'item', url:item.image, tone:theme.tone, domain, label:TIER_LABEL.item };
  if (theme.url) return { tier:'source', url:theme.url, tone:theme.tone, domain, label:TIER_LABEL.source };
  return { tier:'favicon', url:'', tone:theme.tone, domain, label:TIER_LABEL.favicon };
}

function hash(s){
  let h = 0;
  String(s || '').split('').forEach((c) => { h = (h * 31 + c.charCodeAt(0)) | 0; });
  return Math.abs(h);
}

function icoHtml(domain, name){
  const letter = markLetter(name || domain);
  return '<img class="ico" alt="" src="' + fav(domain) + '" ' +
    'onerror="this.onerror=null;this.outerHTML=\'<span class=letter>' + letter + '</span>\'">';
}
function tileHtml(resolved, showTier, name){
  const tone = resolved.tone || '#e8eaef';
  const label = showTier ? '<span class="tier">' + resolved.label + '</span>' : '';
  if (resolved.tier === 'favicon' || !resolved.url) {
    return '<div class="tile fallback" style="background:' + tone + '">' +
      icoHtml(resolved.domain, name) + label + '</div>';
  }
  return '<div class="tile" style="background:' + tone + '" data-domain="' + resolved.domain + '" data-name="' + String(name || '').replace(/"/g,'') + '">' +
    '<img class="photo" alt="" loading="lazy" referrerpolicy="no-referrer" src="' + resolved.url + '">' +
    label + '</div>';
}
function bindTileFallback(root){
  root.querySelectorAll('.tile img.photo').forEach((img) => {
    img.addEventListener('error', () => {
      const tile = img.closest('.tile');
      if (!tile || tile.classList.contains('fallback')) return;
      tile.classList.add('fallback');
      const domain = tile.getAttribute('data-domain') || 'example.com';
      const name = tile.getAttribute('data-name') || domain;
      img.outerHTML = icoHtml(domain, name);
    }, { once:true });
  });
}

/** 把 NewsNow 快照灌进「热议」包；保留主题图，替换标题/摘要/热度 */
function applyHotSnapshot(){
  const snap = window.PACK_HOT;
  const stamp = document.getElementById('hotStamp');
  if (!snap || !snap.bySource) {
    if (stamp) stamp.textContent = '未加载（先跑 refresh-pack-preview-hot）';
    return;
  }
  const hot = PACKS.find((p) => p.key === 'hot');
  if (!hot) return;
  hot.sources = hot.sources.map((s) => {
    const live = snap.bySource[s.n];
    if (!live || !live.live || !live.items || !live.items.length) {
      return { ...s, live: false };
    }
    return {
      ...s,
      live: true,
      domain: live.domain || s.domain,
      items: live.items.map((it) => ({
        t: it.t,
        s: it.s || '',
        heat: it.heat || '',
        rank: it.rank,
        url: it.url || '',
      })),
    };
  });
  hot.count = hot.sources.reduce((n, s) => n + ((s.items && s.items.length) || 0), 0);
  const when = String(snap.updatedAt || '').replace('T', ' ').slice(0, 16);
  hot.desc = '实况热榜 · ' + when + (snap.note ? ' · ' + snap.note : '');
  if (stamp) stamp.textContent = when + ' · ' + hot.count + ' 条';
}

      if (el) el.scrollIntoView({ behavior:'smooth', block:'nearest' });

}
function packsInDir(d){
  const q = packQuery.trim().toLowerCase();
  return PACKS.filter((p) => {
    if (p.dir !== d) return false;
    if (!q) return true;
    return p.label.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q) || p.sub.includes(q);
  });
}
function togglePack(key){
  if (selected.has(key)) selected.delete(key);
  else {
    selected.add(key);
    if (!srcSel[key].size) {
      const p = pack(key);
      p.sources.filter((s) => s.curated).forEach((s) => srcSel[key].add(s.n));
    }
  }
}
function toggleSrc(key, name){
  const set = srcSel[key];
  if (set.has(name)) set.delete(name);
  else set.add(name);
  if (!set.size && selected.has(key)) selected.delete(key);
}

function coverSources(p){
  const curated = p.sources.filter((s) => s.curated);
  const list = (curated.length ? curated : p.sources).slice(0, 3);
  while (list.length < 3) list.push(list[list.length - 1] || p.sources[0]);
  return list;
}

    const n = PACKS.filter((p) => p.dir === d.key).length;
    const onN = PACKS.filter((p) => p.dir === d.key && selected.has(p.key)).length;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'title-btn' + (d.key === dir ? ' on' : '');
    b.innerHTML = '<span class="big">' + d.key + '</span><span class="small">' + (onN ? onN + ' 已加入 · ' : '') + n + ' 个包</span>';
    b.onclick = () => {
      dir = d.key;
      const first = packsInDir(dir)[0];
      openPack = first ? first.key : null;
      showAllSrc = false;
      mobileDetail = true;
      render();
    };
    host.appendChild(b);
  });
}

function renderExpand(p){
  const on = selected.has(p.key);
  const rows = showAllSrc ? p.sources : p.sources.filter((s) => s.curated);
  const box = document.createElement('div');
  box.className = 'pack-expand';
  box.id = 'expand';
  box.innerHTML =
    '<div class="expand-head">' +
      '<div class="who">' +
        '<div class="mark ' + p.cls + '">' + p.mark + '</div>' +
        '<div><h4>' + p.label + '</h4><p>' + p.desc + '</p></div>' +
      '</div>' +
      '<div class="expand-actions">' +
        '<button type="button" class="btn sm" id="toggleAllSrc">' + (showAllSrc ? '只看精选源' : '展开全部源 ' + p.sources.length) + '</button>' +
        '<button type="button" class="btn sm ghost" id="pickCurated">恢复精选</button>' +
        '<button type="button" class="btn ' + (on ? 'danger' : 'primary') + '" id="joinBtn">' + (on ? '移出栏目' : '加入栏目') + '</button>' +
      '</div>' +
    '</div>' +
    '<div class="expand-body" id="expandBody"></div>';

  const body = box.querySelector('#expandBody');
  rows.forEach((s) => {
    const checked = srcSel[p.key].has(s.n);
    const panel = document.createElement('section');
    panel.className = 'src-panel' + (checked ? '' : ' off');

    const head = document.createElement('button');
    head.type = 'button';
    head.className = 'src-panel-head';
    const liveTag = s.live ? '实况' : (p.key === 'hot' ? '示意' : (s.curated ? '精选' : '扩展'));
    head.innerHTML =
      '<span class="check' + (checked ? ' on' : '') + '">' + (checked ? '✓' : '') + '</span>' +
      icoHtml(s.domain, s.n).replace('class="ico"', 'class="ico favicon"') +
      '<span class="lab"><b>' + s.n + '</b><span>' + liveTag + ' · ' + s.domain + '</span></span>' +
      '<span class="cnt">' + ((s.items && s.items.length) || 0) + '</span>';
    head.onclick = () => { toggleSrc(p.key, s.n); render(); };
    panel.appendChild(head);

    const list = document.createElement('div');
    list.className = 'item-list';
    (s.items || []).slice(0, 6).forEach((it, ii) => {
      const heat = String(it.heat || '').trim();
      const isHeat = /热度|热|讨论|评论|万/.test(heat) && !/^#\d+$/.test(heat);
      const el = document.createElement('article');
      el.className = 'item';
      el.innerHTML =
        '<div class="rk">' + (it.rank || ii + 1) + '</div>' +
        '<div class="txt">' +
          '<div class="ti">' + esc(it.t) + '</div>' +
          '<div class="meta">' +
            (heat ? '<span class="' + (isHeat ? 'heat' : 'rank') + '">' + esc(heat) + '</span>' : '') +
            (s.live ? '<span class="tag live-pill">实况</span>' : '') +
          '</div>' +
        '</div>';
      if (it.url) {
        el.style.cursor = 'pointer';
        el.title = '打开原文';
        el.addEventListener('click', () => window.open(it.url, '_blank', 'noopener'));
      }
      list.appendChild(el);
    });
    if (!(s.items || []).length) {
      list.innerHTML = '<div class="empty" style="padding:12px;font-size:12px">暂无预览</div>';
    }
    panel.appendChild(list);
    body.appendChild(panel);
  });

  box.querySelector('#toggleAllSrc').onclick = () => { showAllSrc = !showAllSrc; render(); };
  box.querySelector('#pickCurated').onclick = () => {
    srcSel[p.key] = new Set(p.sources.filter((s) => s.curated).map((s) => s.n));
    render();
  };
  box.querySelector('#joinBtn').onclick = () => { togglePack(p.key); render(); };
  return box;
}

function renderMain(){
  const host = document.getElementById('mainScroll');
  const list = packsInDir(dir);
  const dirMeta = DIRS.find((d) => d.key === dir) || { blurb:'' };
  const subs = SUBS[dir] || [];

  host.innerHTML =
    '<div class="back-row"><button type="button" class="btn ghost sm" id="backRail">← 大标题</button></div>' +
    '<div class="main-top">' +
      '<div><h2>' + dir + '</h2><p class="sub">' + dirMeta.blurb + ' · 包封面拼贴取自旗下来源主题图</p></div>' +
      '<input class="search" id="packQ" type="search" placeholder="搜本目录内容包" value="' + packQuery.replace(/"/g,'&quot;') + '">' +
    '</div>' +
    '<div id="groups"></div>';

  const back = host.querySelector('#backRail');
  if (back) back.onclick = () => { mobileDetail = false; render(); };
  host.querySelector('#packQ').oninput = (e) => { packQuery = e.target.value; render(); };

  const groups = host.querySelector('#groups');
  if (!list.length) {
    groups.innerHTML = '<div class="empty">该大标题下暂无内容包</div>';
    return;
  }

  const order = subs.slice();
  list.forEach((p) => { if (!order.includes(p.sub)) order.push(p.sub); });

  // 单包目录（如综合）默认展开，避免大封面空转
  if (list.length === 1 && !openPack) openPack = list[0].key;

  order.forEach((sub) => {
    const packs = list.filter((p) => p.sub === sub);
    if (!packs.length) return;
    const solo = list.length === 1;
    const group = document.createElement('section');
    group.className = 'group';
    group.innerHTML =
      '<div class="subhead"><h3>' + sub + '</h3><span>' + packs.length + ' 个内容包 · ' +
        packs.reduce((n, p) => n + p.sources.filter((s) => s.curated).length, 0) + ' 精选源</span></div>' +
      '<div class="pack-grid' + (solo ? ' solo' : '') + '"></div>';
    const grid = group.querySelector('.pack-grid');
    packs.forEach((p) => {
      const on = selected.has(p.key);
      const opened = openPack === p.key;
      const covers = coverSources(p);
      const curatedN = p.sources.filter((s) => s.curated).length;
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'pack-card' + (on ? ' on' : '') + (opened ? ' open' : '');
      card.innerHTML =
        '<div class="pack-cover">' +
          covers.map((s, i) => tileHtml(resolveFor('packCover', s, null, i), i === 0, s.n)).join('') +
        '</div>' +
        '<div class="body">' +
          '<div class="row">' +
            '<div class="mark ' + p.cls + '">' + p.mark + '</div>' +
            '<div><div class="name">' + p.label + '</div><div class="desc">' + p.desc + '</div></div>' +
          '</div>' +
          '<div class="src-strip">' +
            p.sources.filter((s)=>s.curated).slice(0, solo ? 10 : 5).map((s) =>
              '<span title="' + s.n + '">' + icoHtml(s.domain, s.n) + '</span>'
            ).join('') +
            (curatedN > (solo ? 10 : 5) ? '<span class="more">+' + (curatedN - (solo ? 10 : 5)) + '</span>' : '') +
          '</div>' +
          '<div class="meta">' +
            '<span class="pill">' + p.count + ' 条</span>' +
            '<span class="pill">' + curatedN + ' 精选源</span>' +
            (on ? '<span class="pill ok">已加入</span>' : '<span class="pill">未加入</span>') +
          '</div>' +
        '</div>';
      card.onclick = () => {
        openPack = opened && !solo ? null : p.key;
        showAllSrc = false;
        render();
        if (openPack) {
          const el = document.getElementById('expand');
          if (el) el.scrollIntoView({ behavior:'smooth', block:'nearest' });
        }
      };
      bindTileFallback(card);
      grid.appendChild(card);
      if (opened) grid.appendChild(renderExpand(p));
    });
    groups.appendChild(group);
  });
}

function renderCta(){
  const p = openPack ? pack(openPack) : null;
  const cta = document.getElementById('cta');
  if (!p) {
    cta.innerHTML =
      '<div class="hint">在「' + dir + '」点开内容包。已选 <b>' + selected.size + '</b> 个包。</div>' +
      '<div class="actions"><button type="button" class="btn primary" id="goDigest">去今日阅读 →</button></div>';
    cta.querySelector('#goDigest').onclick = () => alert('示意：已选 ' + selected.size + ' 个栏目');
    return;
  }
  const on = selected.has(p.key);
  cta.innerHTML =
    '<div class="hint">展开 <b>' + p.label + '</b> · 勾选 <b>' + srcSel[p.key].size + '</b> / ' + p.sources.length + ' 个来源' +
    (on ? ' · 已在栏目中' : ' · 尚未加入') + '</div>' +
    '<div class="actions">' +
      '<button type="button" class="btn ' + (on ? 'danger' : 'primary') + '" id="ctaJoin">' + (on ? '移出栏目' : '加入栏目') + '</button>' +
    '</div>';
  cta.querySelector('#ctaJoin').onclick = () => { togglePack(p.key); render(); };
}

function render(){
  document.getElementById('dirHint').textContent = dir;
  document.getElementById('picker').classList.toggle('mobile-detail', mobileDetail);
  renderSelHero();
  renderRail();
  renderMain();
  renderCta();
}

function esc(s){
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.querySelectorAll('.fmt-chip').forEach((b) => {
  b.onclick = () => document.querySelectorAll('.fmt-chip').forEach((x) => x.classList.toggle('on', x === b));
});
document.getElementById('btnSources').onclick = () => alert('示意：跳转「全部源」页');
document.getElementById('btnDigest').onclick = () => alert('示意：已选 ' + selected.size + ' 个栏目');
document.getElementById('btnRefreshHot').onclick = () => {
  alert('在仓库根目录执行：\n\nnode tools/refresh-pack-preview-hot.mjs\n\n然后刷新本页，即可更新社区「热议」热榜标题/热度。');
};

applyHotSnapshot();
// 灌入实况后，默认精选源勾选跟上
PACKS.forEach((p) => {
  if (!srcSel[p.key] || !srcSel[p.key].size) {
    srcSel[p.key] = new Set(p.sources.filter((s) => s.curated).map((s) => s.n));
  }
});
render();
</script>
</body>
</html>
